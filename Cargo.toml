[package]
name = "bear"
version = "0.1.0"
authors = ["bear contributors"]
edition = "2021"
description = "Bear is a modern CLI tool for creating reverse tunnels to Bear Web Gateway"
repository = "https://github.com/example/bear"
keywords = ["network", "tunnel", "tcp", "proxy", "remote-desktop", "vnc", "rdp"]
categories = ["network-programming", "command-line-utilities", "remote-access"]
readme = "README.md"
license = "MIT"

[[bin]]
name = "bear"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
colored = "2.1"
hostname = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
fastrand = "0.7"